<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Onechat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#09090B" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #09090B;
      color: #F4F4F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #14243A;
      color: #3B82F6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      border: 1px solid rgba(59, 130, 246, 0.3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      margin-bottom: 16px;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 6px 0;
    }
    .subtitle {
      font-size: 13px;
      color: #71717A;
      margin: 0 0 24px 0;
    }
    .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid #25252B;
      border-top-color: #3B82F6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo">#</div>
  <h1 class="title">Onechat</h1>
  <p class="subtitle">Connecting to your people...</p>
  <div class="spinner"></div>

  <script>
    // Redirect to configured host or local route when ready
    window.addEventListener('DOMContentLoaded', () => {
      // In Capacitor native WebView, navigation routes automatically
    });
  </script>
</body>
</html>
